syntax = "proto3";

package vla;

// 14-dimensional action vector (6 DOF + gripper per arm)
message ActionVector {
  repeated double values = 1;
}

// Inference request: images + action trajectory + metadata
message InferRequest {
  map<string, bytes> images = 1;       // camera_name -> jpeg bytes
  repeated ActionVector action = 2;    // state trajectory for prefill
  int32 state_delta = 3;              // predicted steps offset
  double timestamp = 4;               // observation timestamp
}

// Inference response: optimized actions + raw actions + timing
message InferResponse {
  repeated ActionVector action_list = 1;      // optimized actions
  repeated ActionVector raw_action_list = 2;  // raw model output
  double infer_time = 3;                      // server-side inference time (seconds)
  int64 sequence_id = 4;                      // matches request ordering in streaming
}

// Server status message for monitoring
message ServerStatus {
  string status = 1;          // "ready", "busy", "error"
  double uptime_s = 2;        // server uptime in seconds
  int64 total_requests = 3;   // total processed requests
  double avg_infer_time = 4;  // average inference time
  double timestamp = 5;       // status timestamp
}

// Camera configuration: name list + optional metadata per camera
message CameraConfig {
  repeated string camera_names = 1;  // e.g. ["high", "left_hand", "right_hand"]
}

// Request to get server's camera configuration
message CameraConfigRequest {}

// Serialized tensor batch for preprocessed model inputs (torch.save format)
message TensorBatchInferRequest {
  bytes batch_data = 1;    // torch.save'd dict of tensors (images, lang_tokens, states, etc.)
  string unnorm_key = 2;   // denormalization key (e.g. "libero_10")
}

// Serialized tensor response
message TensorBatchInferResponse {
  bytes action_data = 1;   // torch.save'd action tensor
  double infer_time = 2;   // server-side inference time (seconds)
}

// Empty message for status stream initiation
message StatusRequest {
  double interval_s = 1;  // desired status update interval (seconds)
}

// VLA inference service with unary, bidirectional streaming, and server streaming
service VLAService {
  // Unary RPC: single request-response (compatible with original HTTP mode)
  rpc Infer(InferRequest) returns (InferResponse);

  // Bidirectional streaming: client sends observation frames, server returns actions
  rpc InferStream(stream InferRequest) returns (stream InferResponse);

  // Server streaming: server pushes periodic status updates
  rpc StatusStream(StatusRequest) returns (stream ServerStatus);

  // Unary RPC: query server's expected camera configuration
  rpc GetCameraConfig(CameraConfigRequest) returns (CameraConfig);

  // Unary RPC: tensor-batch inference for preprocessed model inputs
  rpc TensorBatchInfer(TensorBatchInferRequest) returns (TensorBatchInferResponse);
}
